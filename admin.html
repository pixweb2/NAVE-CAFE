<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>پنل مدیریت | NAVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #14247a;
    --primary-light: #2a3d9e;
    --white: #ffffff;
    --gray-bg: #f4f6fb;
    --gray-border: #e2e6f2;
    --text-dark: #1a1f36;
    --text-muted: #6b7391;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
  }
  body {
    font-family: 'Vazirmatn', sans-serif;
    background: var(--gray-bg);
    color: var(--text-dark);
    min-height: 100vh;
    padding: 0 16px 24px;
  }
  .login-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #14247a 0%, #2a3d9e 100%);
    z-index: 9000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-screen.hidden { display: none; }
  .login-box {
    background: var(--white);
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 25px 70px rgba(0,0,0,0.3);
    text-align: center;
  }
  .login-icon {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--primary);
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    margin: 0 auto 20px;
  }
  .login-box h2 { font-size: 1.4rem; margin-bottom: 6px; }
  .login-box p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px; }
  .login-input {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid var(--gray-border);
    border-radius: 14px;
    font-family: inherit;
    font-size: 1rem;
    text-align: center;
    letter-spacing: 2px;
    outline: none;
    margin-bottom: 12px;
    direction: ltr;
  }
  .login-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(20, 36, 122, 0.1); }
  .login-error { color: var(--danger); font-size: 0.82rem; margin-bottom: 12px; min-height: 1.2em; font-weight: 600; }
  .btn-login {
    width: 100%;
    background: var(--primary);
    color: var(--white);
    border: none;
    padding: 14px;
    border-radius: 14px;
    font-family: inherit;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
  }
  .btn-login:hover { background: var(--primary-light); }

  .token-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #14247a 0%, #2a3d9e 100%);
    z-index: 9000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .token-screen.hidden { display: none; }
  .token-box {
    background: var(--white);
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 25px 70px rgba(0,0,0,0.3);
  }
  .token-box h2 { font-size: 1.3rem; margin-bottom: 8px; text-align: center; }
  .token-box > p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; text-align: center; }
  .token-box textarea {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid var(--gray-border);
    border-radius: 14px;
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
    margin-bottom: 12px;
    min-height: 90px;
    text-align: center;
    resize: vertical;
  }
  .token-box textarea:focus { border-color: var(--primary); }

  .dashboard { display: none; }
  .dashboard.show { display: block; }
  .container { max-width: 1200px; margin: 20px auto 0; }

  .admin-header {
    background: var(--white);
    border-radius: 20px;
    padding: 18px 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    box-shadow: 0 6px 24px rgba(20, 36, 122, 0.08);
    margin-bottom: 20px;
  }
  .admin-brand { display: flex; align-items: center; gap: 14px; }
  .admin-brand img {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: contain;
    background: var(--gray-bg);
  }
  .admin-brand h1 { font-size: 1.15rem; color: var(--primary); font-weight: 900; }
  .admin-brand span { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 400; }
  .admin-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .btn {
    border: none;
    padding: 10px 18px;
    border-radius: 12px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-primary { background: var(--primary); color: var(--white); }
  .btn-primary:hover { background: var(--primary-light); }
  .btn-success { background: var(--success); color: var(--white); }
  .btn-danger { background: var(--danger); color: var(--white); }
  .btn-ghost { background: var(--gray-bg); color: var(--text-dark); }
  .btn-sm { padding: 8px 14px; font-size: 0.78rem; }

  .status-badge {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .status-badge.saved { background: #dcfce7; color: #166534; }
  .status-badge.saving { background: #dbeafe; color: #1e40af; }
  .status-badge.error { background: #fee2e2; color: #991b1b; }

  .admin-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .admin-tab {
    background: var(--white);
    border: 1.5px solid var(--gray-border);
    padding: 10px 20px;
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text-muted);
    border-radius: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .admin-tab.active {
    background: var(--primary);
    color: var(--white);
    border-color: var(--primary);
  }

  .panel {
    background: var(--white);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 6px 24px rgba(20, 36, 122, 0.08);
    display: none;
  }
  .panel.show { display: block; }
  .panel-header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--gray-border);
  }
  .panel-header h2 {
    font-size: 1.15rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .panel-header h2 i { color: var(--primary); }

  .panel-filters {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 20px;
  }
  .panel-filters select,
  .panel-filters input {
    padding: 10px 14px;
    border: 1.5px solid var(--gray-border);
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.85rem;
    outline: none;
  }
  .panel-filters input { flex: 1; min-width: 180px; }

  .admin-product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .admin-product {
    background: var(--gray-bg);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .admin-product-img {
    width: 60px;
    height: 60px;
    border-radius: 12px;
    background: var(--white);
    overflow: hidden;
    flex-shrink: 0;
  }
  .admin-product-img img { width: 100%; height: 100%; object-fit: cover; }
  .admin-product-info { flex: 1; min-width: 0; }
  .admin-product-info h4 {
    font-size: 0.92rem;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .admin-product-info .meta {
    font-size: 0.72rem;
    color: var(--text-muted);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .admin-product-info .meta .price { color: var(--primary); font-weight: 700; }
  .admin-product-info .meta .tag {
    background: var(--white);
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.65rem;
  }
  .admin-product-actions { display: flex; flex-direction: column; gap: 6px; }
  .icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: var(--white);
    color: var(--primary);
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { background: var(--primary); color: var(--white); }
  .icon-btn.danger:hover { background: var(--danger); color: var(--white); }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 20, 50, 0.6);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--white);
    border-radius: 24px;
    padding: 28px;
    max-width: 560px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 {
    font-size: 1.15rem;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .modal h3 i { color: var(--primary); }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .form-group label span { color: var(--danger); }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--gray-border);
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--primary); }
  .form-group textarea { min-height: 80px; resize: vertical; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* عکس + آپلود */
  .img-wrapper {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .img-preview {
    width: 100%;
    aspect-ratio: 2/1;
    border-radius: 12px;
    background: var(--gray-bg);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 0.82rem;
    border: 1.5px dashed var(--gray-border);
    position: relative;
  }
  .img-preview img { width: 100%; height: 100%; object-fit: contain; }
  .img-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .img-actions input[type="file"] { display: none; }
  .img-actions label {
    flex: 1;
    min-width: 120px;
    background: var(--primary);
    color: var(--white);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.82rem;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .img-actions label:hover { background: var(--primary-light); }
  .img-actions .btn-remove-img {
    background: var(--danger);
    color: var(--white);
    border: none;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .img-actions .btn-remove-img:hover { background: #dc2626; }
  .img-actions .btn-remove-img:disabled { opacity: 0.4; cursor: not-allowed; }

  .upload-status {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-align: center;
    min-height: 1.2em;
  }
  .upload-status.loading { color: var(--primary); font-weight: 700; }
  .upload-status.success { color: var(--success); font-weight: 700; }
  .upload-status.error { color: var(--danger); font-weight: 700; }

  .form-hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 6px; }
  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--gray-border);
  }

  .settings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  .settings-card {
    background: var(--gray-bg);
    border-radius: 16px;
    padding: 20px;
  }
  .settings-card h4 {
    font-size: 0.95rem;
    color: var(--primary);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .settings-card .form-group { margin-bottom: 12px; }
  .settings-card .form-group:last-child { margin-bottom: 0; }

  .toast-admin {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-120px);
    padding: 14px 24px;
    border-radius: 30px;
    color: var(--white);
    font-weight: 700;
    font-size: 0.88rem;
    z-index: 2000;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: transform 0.4s;
    pointer-events: none;
    max-width: 90vw;
  }
  .toast-admin.show { transform: translateX(-50%) translateY(0); }
  .toast-admin.success { background: var(--success); }
  .toast-admin.error { background: var(--danger); }
  .toast-admin.info { background: var(--primary); }

  @media (max-width: 700px) {
    body { padding: 0 10px 20px; }
    .panel { padding: 16px; }
    .admin-product-grid { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- صفحه ورود -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-icon"><i class="fas fa-lock"></i></div>
    <h2>پنل مدیریت NAVE</h2>
    <p>رمز عبور را وارد کنید</p>
    <input type="password" class="login-input" id="loginPassword" placeholder="رمز" />
    <div class="login-error" id="loginError"></div>
    <button class="btn-login" id="loginBtn"><i class="fas fa-sign-in-alt"></i> ورود</button>
  </div>
</div>

<!-- صفحه رمز دوم -->
<div class="token-screen hidden" id="tokenScreen">
  <div class="token-box">
    <h2><i class="fas fa-key"></i> رمز دوم</h2>
    <p>برای دسترسی به تنظیمات، رمز دوم را وارد کنید.</p>
    <textarea id="tokenInput" placeholder="رمز دوم را وارد کنید..."></textarea>
    <div class="login-error" id="tokenError"></div>
    <button class="btn-login" id="tokenBtn"><i class="fas fa-check"></i> تأیید</button>
  </div>
</div>

<!-- داشبورد -->
<div class="dashboard" id="dashboard">
  <div class="container">
    <header class="admin-header">
      <div class="admin-brand">
        <img src="logo.webp" alt="NAVE" id="adminLogo" />
        <div>
          <h1 id="adminBrandName">NAVE</h1>
          <span>پنل مدیریت</span>
        </div>
      </div>
      <div class="admin-actions">
        <span class="status-badge saved" id="statusBadge">
          <i class="fas fa-check-circle"></i>
          <span id="statusText">آماده</span>
        </span>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">
          <i class="fas fa-sign-out-alt"></i> خروج
        </button>
      </div>
    </header>

    <div class="admin-tabs">
      <button class="admin-tab active" data-panel="products">
        <i class="fas fa-mug-hot"></i> محصولات
      </button>
      <button class="admin-tab" data-panel="settings">
        <i class="fas fa-cog"></i> تنظیمات
      </button>
    </div>

    <!-- پنل محصولات -->
    <div class="panel show" id="panelProducts">
      <div class="panel-header">
        <h2><i class="fas fa-mug-hot"></i> مدیریت محصولات</h2>
        <button class="btn btn-primary" id="addProductBtn">
          <i class="fas fa-plus"></i> محصول جدید
        </button>
      </div>
      <div class="panel-filters">
        <select id="filterCategory">
          <option value="all">همه دسته‌ها</option>
          <option value="shake">شیک</option>
          <option value="tea">دمنوش</option>
          <option value="espresso">بر پایه اسپرسو</option>
          <option value="drink">نوشیدنی</option>
          <option value="cake">کیک و دسر</option>
        </select>
        <input type="text" id="filterSearch" placeholder="جستجو..." />
      </div>
      <div class="admin-product-grid" id="adminProductGrid"></div>
    </div>

    <!-- پنل تنظیمات -->
    <div class="panel" id="panelSettings">
      <div class="panel-header">
        <h2><i class="fas fa-cog"></i> تنظیمات</h2>
        <button class="btn btn-success" id="saveConfigBtn">
          <i class="fas fa-save"></i> ذخیره تنظیمات
        </button>
      </div>
      <div class="settings-grid">
        <div class="settings-card">
          <h4><i class="fas fa-store"></i> اطلاعات کافه</h4>
          <div class="form-group"><label>نام کافه</label><input type="text" id="cfgCafeName" /></div>
          <div class="form-group"><label>زیرنویس</label><input type="text" id="cfgTagline" /></div>
          <div class="form-group"><label>لوگو (نام فایل)</label><input type="text" id="cfgLogo" /></div>
        </div>
        <div class="settings-card">
          <h4><i class="fas fa-phone"></i> ارتباطی</h4>
          <div class="form-group"><label>شماره تماس</label><input type="text" id="cfgPhone" /></div>
          <div class="form-group"><label>شماره نمایشی</label><input type="text" id="cfgPhoneDisplay" /></div>
          <div class="form-group"><label>آیدی اینستاگرام</label><input type="text" id="cfgInstagram" /></div>
          <div class="form-group"><label>لینک اینستاگرام</label><input type="text" id="cfgInstagramUrl" /></div>
        </div>
        <div class="settings-card">
          <h4><i class="fas fa-chair"></i> میزها</h4>
          <div class="form-group"><label>تعداد میزها</label><input type="number" id="cfgTableCount" min="1" max="20" /></div>
          <div class="form-group"><label>بیرون‌بر</label>
            <select id="cfgTakeaway">
              <option value="true">فعال</option>
              <option value="false">غیرفعال</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- مودال محصول -->
<div class="modal-overlay" id="productModal">
  <div class="modal">
    <h3 id="productModalTitle"><i class="fas fa-plus-circle"></i> <span>محصول جدید</span></h3>

    <!-- بخش عکس با آپلود -->
    <div class="form-group">
      <label>عکس محصول</label>
      <div class="img-wrapper">
        <div class="img-preview" id="imgPreview"><span>پیش‌نمایش عکس</span></div>
        <div class="img-actions">
          <label for="imgUpload">
            <i class="fas fa-upload"></i> آپلود عکس
          </label>
          <input type="file" id="imgUpload" accept="image/*" />
          <button type="button" class="btn-remove-img" id="removeImgBtn">
            <i class="fas fa-trash"></i> حذف عکس
          </button>
        </div>
        <div class="upload-status" id="uploadStatus"></div>
      </div>
      <input type="hidden" id="pImage" />
      <div class="form-hint">💡 فرمت‌های قابل قبول: jpg, png, webp, gif</div>
    </div>

    <div class="form-group">
      <label>نام <span>*</span></label>
      <input type="text" id="pName" />
    </div>
    <div class="form-group">
      <label>توضیحات</label>
      <textarea id="pDesc"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>قیمت (هزار تومان)</label>
        <input type="number" id="pPrice" min="0" />
        <div class="form-hint">خالی = بدون قیمت</div>
      </div>
      <div class="form-group">
        <label>دسته <span>*</span></label>
        <select id="pCategory">
          <option value="shake">شیک</option>
          <option value="tea">دمنوش</option>
          <option value="espresso">بر پایه اسپرسو</option>
          <option value="drink">نوشیدنی</option>
          <option value="cake">کیک و دسر</option>
        </select>
      </div>
    </div>
    <div class="form-group" id="tempGroup">
      <label>دما</label>
      <select id="pTemp">
        <option value="">بدون تفکیک</option>
        <option value="hot">گرم</option>
        <option value="cold">سرد</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelProductBtn">انصراف</button>
      <button class="btn btn-primary" id="saveProductBtn"><i class="fas fa-save"></i> ذخیره</button>
    </div>
  </div>
</div>

<!-- توست -->
<div class="toast-admin" id="adminToast">
  <i class="fas fa-check-circle"></i>
  <span id="adminToastText">ذخیره شد</span>
</div>

<script>
/* ============================================
   تنظیمات
   ============================================ */
const GITHUB = { owner: "pixweb2", repo: "NAVE-CAFE", branch: "main" };
const PASSWORD = "1405";

let CONFIG = {};
let PRODUCTS = [];
let editingId = null;
let GH_TOKEN = "";
let currentImageFilename = "";

/* ============================================
   Helpers
   ============================================ */
function showToast(text, type = "success") {
  const toast = document.getElementById("adminToast");
  document.getElementById("adminToastText").textContent = text;
  toast.className = "toast-admin show " + type;
  clearTimeout(window._t);
  window._t = setTimeout(() => toast.classList.remove("show"), 3000);
}
function setStatus(state, text) {
  document.getElementById("statusBadge").className = "status-badge " + state;
  document.getElementById("statusText").textContent = text;
}
function b64Encode(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64Decode(str) { return decodeURIComponent(escape(atob(str))); }

/* تبدیل فایل به Base64 (بدون prefix) */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      // حذف "data:image/xxx;base64,"
      const base64 = result.split(",")[1];
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================================
   API
   ============================================ */
async function ghGet(path) {
  const url = `https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}/contents/${path}?ref=${GITHUB.branch}&t=${Date.now()}`;
  const res = await fetch(url, {
    headers: { "Authorization": `Bearer ${GH_TOKEN}`, "Accept": "application/vnd.github+json" }
  });
  if (!res.ok) {
    if (res.status === 404) return null;
    throw new Error("GET failed: " + res.status);
  }
  const data = await res.json();
  return { content: b64Decode(data.content), sha: data.sha };
}

async function ghPut(path, content, message) {
  let sha = null;
  try {
    const existing = await ghGet(path);
    if (existing) sha = existing.sha;
  } catch (e) {}
  const url = `https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}/contents/${path}`;
  const body = { message: message || `update ${path}`, content: b64Encode(content), branch: GITHUB.branch };
  if (sha) body.sha = sha;
  const res = await fetch(url, {
    method: "PUT",
    headers: { "Authorization": `Bearer ${GH_TOKEN}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || "PUT failed: " + res.status);
  }
  return res.json();
}

/* آپلود فایل باینری (برای عکس) */
async function ghPutBinary(path, base64Content, message) {
  let sha = null;
  try {
    const existing = await ghGet(path);
    if (existing) sha = existing.sha;
  } catch (e) {}

  const url = `https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}/contents/${path}`;
  const body = {
    message: message || `upload ${path}`,
    content: base64Content,
    branch: GITHUB.branch
  };
  if (sha) body.sha = sha;

  const res = await fetch(url, {
    method: "PUT",
    headers: { "Authorization": `Bearer ${GH_TOKEN}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || "Upload failed: " + res.status);
  }
  return res.json();
}

/* حذف فایل */
async function ghDelete(path, message) {
  const existing = await ghGet(path);
  if (!existing) return; // فایل وجود نداره
  const url = `https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}/contents/${path}`;
  const body = {
    message: message || `delete ${path}`,
    sha: existing.sha,
    branch: GITHUB.branch
  };
  const res = await fetch(url, {
    method: "DELETE",
    headers: { "Authorization": `Bearer ${GH_TOKEN}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || "Delete failed: " + res.status);
  }
  return res.json();
}

async function loadData() {
  const [cfg, menu] = await Promise.all([ghGet("config.json"), ghGet("menu.json")]);
  if (cfg) CONFIG = JSON.parse(cfg.content);
  if (menu) PRODUCTS = JSON.parse(menu.content);
}

/* ============================================
   ورود
   ============================================ */
document.getElementById("loginBtn").addEventListener("click", () => {
  const pass = document.getElementById("loginPassword").value;
  const errEl = document.getElementById("loginError");
  errEl.textContent = "";
  if (!pass) {
    errEl.textContent = "رمز را وارد کنید";
    return;
  }
  if (pass === PASSWORD) {
    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("tokenScreen").classList.remove("hidden");
  } else {
    errEl.textContent = "رمز اشتباه است";
    document.getElementById("loginPassword").value = "";
  }
});
document.getElementById("loginPassword").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("loginBtn").click();
});

/* ============================================
   رمز دوم
   ============================================ */
document.getElementById("tokenBtn").addEventListener("click", async () => {
  const tok = document.getElementById("tokenInput").value.trim();
  const errEl = document.getElementById("tokenError");
  errEl.textContent = "";
  if (!tok) { errEl.textContent = "رمز دوم را وارد کنید"; return; }
  GH_TOKEN = tok;
  try {
    await loadData();
    document.getElementById("tokenScreen").classList.add("hidden");
    startDashboard();
  } catch (e) {
    errEl.textContent = "رمز دوم اشتباه است";
    GH_TOKEN = "";
  }
});

/* ============================================
   شروع داشبورد
   ============================================ */
async function startDashboard() {
  document.getElementById("dashboard").classList.add("show");
  try {
    await loadData();
    applyConfig();
    renderProducts();
    setStatus("saved", "آماده");
  } catch (e) {
    showToast("خطا در بارگذاری", "error");
    setStatus("error", "خطا");
  }
}

function applyConfig() {
  document.getElementById("cfgCafeName").value = CONFIG.cafeName || "";
  document.getElementById("cfgTagline").value = CONFIG.tagline || "";
  document.getElementById("cfgLogo").value = CONFIG.logo || "";
  document.getElementById("cfgPhone").value = CONFIG.phone || "";
  document.getElementById("cfgPhoneDisplay").value = CONFIG.phoneDisplay || "";
  document.getElementById("cfgInstagram").value = CONFIG.instagram || "";
  document.getElementById("cfgInstagramUrl").value = CONFIG.instagramUrl || "";
  document.getElementById("cfgTableCount").value = CONFIG.tableCount || 4;
  document.getElementById("cfgTakeaway").value = CONFIG.takeawayEnabled !== false ? "true" : "false";
  document.getElementById("adminBrandName").textContent = CONFIG.cafeName || "NAVE";
  document.getElementById("adminLogo").src = CONFIG.logo || "logo.webp";
}

/* ============================================
   رندر محصولات
   ============================================ */
function renderProducts() {
  const cat = document.getElementById("filterCategory").value;
  const search = document.getElementById("filterSearch").value.trim();
  const filtered = PRODUCTS.filter(p => {
    const mc = cat === "all" || p.category === cat;
    const ms = !search || p.name.includes(search);
    return mc && ms;
  });
  const grid = document.getElementById("adminProductGrid");
  if (filtered.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:#6b7391;">محصولی پیدا نشد</div>';
    return;
  }
  const catNames = { shake: "شیک", tea: "دمنوش", espresso: "اسپرسو", drink: "نوشیدنی", cake: "کیک و دسر" };
  grid.innerHTML = filtered.map(p => {
    const priceText = (p.price === null || p.price === undefined)
      ? '<span class="price">بدون قیمت</span>'
      : `<span class="price">${(p.price * 1000).toLocaleString("fa-IR")} تومان</span>`;
    const tempTag = p.temp === "hot" ? "🔥 گرم" : p.temp === "cold" ? "❄️ سرد" : "";
    return `
      <div class="admin-product">
        <div class="admin-product-img">
          <img src="${p.image || ''}" onerror="this.style.display='none'" />
        </div>
        <div class="admin-product-info">
          <h4>${p.name}</h4>
          <div class="meta">
            ${priceText}
            <span class="tag">${catNames[p.category] || p.category}</span>
            ${tempTag ? `<span class="tag">${tempTag}</span>` : ""}
          </div>
        </div>
        <div class="admin-product-actions">
          <button class="icon-btn" onclick="editProduct(${p.id})"><i class="fas fa-pen"></i></button>
          <button class="icon-btn danger" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button>
        </div>
      </div>
    `;
  }).join("");
}
document.getElementById("filterCategory").addEventListener("change", renderProducts);
document.getElementById("filterSearch").addEventListener("input", renderProducts);

/* ============================================
   محصول جدید
   ============================================ */
document.getElementById("addProductBtn").addEventListener("click", () => {
  editingId = null;
  currentImageFilename = "";
  document.getElementById("productModalTitle").innerHTML = '<i class="fas fa-plus-circle"></i> <span>محصول جدید</span>';
  document.getElementById("pImage").value = "";
  document.getElementById("pName").value = "";
  document.getElementById("pDesc").value = "";
  document.getElementById("pPrice").value = "";
  document.getElementById("pCategory").value = "shake";
  document.getElementById("pTemp").value = "";
  document.getElementById("uploadStatus").textContent = "";
  document.getElementById("uploadStatus").className = "upload-status";
  updateImgPreview();
  toggleTempField();
  document.getElementById("productModal").classList.add("open");
});

/* ============================================
   ویرایش
   ============================================ */
function editProduct(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  currentImageFilename = p.image || "";
  document.getElementById("productModalTitle").innerHTML = '<i class="fas fa-pen"></i> <span>ویرایش محصول</span>';
  document.getElementById("pImage").value = p.image || "";
  document.getElementById("pName").value = p.name || "";
  document.getElementById("pDesc").value = p.desc || "";
  document.getElementById("pPrice").value = (p.price === null || p.price === undefined) ? "" : p.price;
  document.getElementById("pCategory").value = p.category || "shake";
  document.getElementById("pTemp").value = p.temp || "";
  document.getElementById("uploadStatus").textContent = "";
  document.getElementById("uploadStatus").className = "upload-status";
  updateImgPreview();
  toggleTempField();
  document.getElementById("productModal").classList.add("open");
}
window.editProduct = editProduct;

/* ============================================
   حذف محصول
   ============================================ */
async function deleteProduct(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  if (!confirm(`حذف "${p.name}"؟`)) return;
  PRODUCTS = PRODUCTS.filter(x => x.id !== id);
  renderProducts();
  await saveMenu(true);
}
window.deleteProduct = deleteProduct;

/* ============================================
   ذخیره محصول
   ============================================ */
document.getElementById("saveProductBtn").addEventListener("click", async () => {
  const name = document.getElementById("pName").value.trim();
  const cat = document.getElementById("pCategory").value;
  if (!name) { showToast("نام محصول را وارد کنید", "error"); return; }

  const priceRaw = document.getElementById("pPrice").value.trim();
  const priceVal = priceRaw === "" ? null : parseInt(priceRaw);
  const tempVal = document.getElementById("pTemp").value || null;

  const data = {
    name,
    desc: document.getElementById("pDesc").value.trim(),
    price: priceVal,
    category: cat,
    temp: (cat === "espresso" || cat === "drink") ? tempVal : null,
    image: currentImageFilename || ""
  };

  if (editingId === null) {
    const newId = Math.max(0, ...PRODUCTS.map(p => p.id)) + 1;
    PRODUCTS.push({ id: newId, ...data });
  } else {
    const idx = PRODUCTS.findIndex(p => p.id === editingId);
    if (idx !== -1) PRODUCTS[idx] = { ...PRODUCTS[idx], ...data };
  }

  document.getElementById("productModal").classList.remove("open");
  renderProducts();
  await saveMenu(true);
});

document.getElementById("cancelProductBtn").addEventListener("click", () => {
  document.getElementById("productModal").classList.remove("open");
});

/* ============================================
   پیش‌نمایش عکس
   ============================================ */
function updateImgPreview() {
  const src = currentImageFilename;
  const prev = document.getElementById("imgPreview");
  if (!src) {
    prev.innerHTML = "<span>پیش‌نمایش عکس</span>";
    return;
  }
  // اضافه کردن timestamp برای رفرش
  prev.innerHTML = `<img src="${src}?t=${Date.now()}" onerror="this.parentElement.innerHTML='<span>عکس نیست</span>'" />`;
}

/* ============================================
   آپلود عکس
   ============================================ */
document.getElementById("imgUpload").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const statusEl = document.getElementById("uploadStatus");

  // چک حجم (حداکثر 1MB برای GitHub API)
  if (file.size > 1024 * 1024) {
    statusEl.textContent = "❌ حجم عکس باید کمتر از ۱ مگابایت باشد";
    statusEl.className = "upload-status error";
    e.target.value = "";
    return;
  }

  statusEl.textContent = "⏳ در حال آپلود...";
  statusEl.className = "upload-status loading";

  try {
    // نام فایل اصلی (همون که آپلود شد)
    const filename = file.name;

    // تبدیل به base64
    const base64 = await fileToBase64(file);

    // آپلود به گیت‌هاب
    await ghPutBinary(filename, base64, `upload ${filename}`);

    // آپدیت state
    currentImageFilename = filename;
    document.getElementById("pImage").value = filename;
    updateImgPreview();

    statusEl.textContent = "✅ عکس با موفقیت آپلود شد";
    statusEl.className = "upload-status success";
  } catch (err) {
    console.error(err);
    statusEl.textContent = "❌ خطا در آپلود: " + err.message;
    statusEl.className = "upload-status error";
  }

  // پاک کردن input تا بشه دوباره همون فایل رو انتخاب کرد
  e.target.value = "";
});

/* ============================================
   حذف عکس
   ============================================ */
document.getElementById("removeImgBtn").addEventListener("click", async () => {
  if (!currentImageFilename) {
    showToast("عکسی برای حذف وجود ندارد", "error");
    return;
  }

  if (!confirm(`حذف عکس "${currentImageFilename}"؟`)) return;

  const statusEl = document.getElementById("uploadStatus");
  statusEl.textContent = "⏳ در حال حذف...";
  statusEl.className = "upload-status loading";

  try {
    await ghDelete(currentImageFilename, `delete ${currentImageFilename}`);
    currentImageFilename = "";
    document.getElementById("pImage").value = "";
    updateImgPreview();
    statusEl.textContent = "✅ عکس حذف شد";
    statusEl.className = "upload-status success";
  } catch (err) {
    console.error(err);
    statusEl.textContent = "❌ خطا در حذف: " + err.message;
    statusEl.className = "upload-status error";
  }
});

/* ============================================
   نمایش/مخفی فیلد دما
   ============================================ */
function toggleTempField() {
  const cat = document.getElementById("pCategory").value;
  document.getElementById("tempGroup").style.display = (cat === "espresso" || cat === "drink") ? "block" : "none";
}
document.getElementById("pCategory").addEventListener("change", toggleTempField);

/* ============================================
   ذخیره منو
   ============================================ */
async function saveMenu(show) {
  setStatus("saving", "در حال ذخیره...");
  try {
    await ghPut("menu.json", JSON.stringify(PRODUCTS, null, 2), `update menu - ${new Date().toLocaleString("fa-IR")}`);
    setStatus("saved", "ذخیره شد");
    if (show) showToast("منو ذخیره شد", "success");
  } catch (e) {
    setStatus("error", "خطا");
    showToast("خطا: " + e.message, "error");
  }
}

/* ============================================
   ذخیره تنظیمات
   ============================================ */
document.getElementById("saveConfigBtn").addEventListener("click", async () => {
  CONFIG.cafeName = document.getElementById("cfgCafeName").value.trim();
  CONFIG.tagline = document.getElementById("cfgTagline").value.trim();
  CONFIG.logo = document.getElementById("cfgLogo").value.trim();
  CONFIG.phone = document.getElementById("cfgPhone").value.trim();
  CONFIG.phoneDisplay = document.getElementById("cfgPhoneDisplay").value.trim();
  CONFIG.instagram = document.getElementById("cfgInstagram").value.trim();
  CONFIG.instagramUrl = document.getElementById("cfgInstagramUrl").value.trim();
  CONFIG.tableCount = parseInt(document.getElementById("cfgTableCount").value) || 4;
  CONFIG.takeawayEnabled = document.getElementById("cfgTakeaway").value === "true";
  setStatus("saving", "در حال ذخیره...");
  try {
    await ghPut("config.json", JSON.stringify(CONFIG, null, 2), "update config");
    setStatus("saved", "ذخیره شد");
    showToast("تنظیمات ذخیره شد", "success");
    document.getElementById("adminBrandName").textContent = CONFIG.cafeName || "NAVE";
    document.getElementById("adminLogo").src = CONFIG.logo || "logo.webp";
  } catch (e) {
    setStatus("error", "خطا");
    showToast("خطا: " + e.message, "error");
  }
});

/* ============================================
   تب‌ها
   ============================================ */
document.querySelectorAll(".admin-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".admin-tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("show"));
    const name = tab.dataset.panel;
    document.getElementById("panel" + name.charAt(0).toUpperCase() + name.slice(1)).classList.add("show");
  });
});

document.getElementById("logoutBtn").addEventListener("click", () => {
  if (confirm("خروج؟")) location.reload();
});
</script>
</body>
</html>
