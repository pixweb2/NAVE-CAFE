<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NAVE | منوی دیجیتال</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #14247a;
    --primary-light: #2a3d9e;
    --white: #ffffff;
    --gray-bg: #f4f6fb;
    --gray-border: #e2e6f2;
    --text-dark: #1a1f36;
    --text-muted: #6b7391;
  }

  body {
    font-family: 'Vazirmatn', sans-serif;
    background: var(--gray-bg);
    color: var(--text-dark);
    min-height: 100vh;
    padding: 0 16px 24px;
  }

  /* ==================== کانتینر ==================== */
  .container {
    max-width: 1250px;
    margin: 20px auto 0;
    background: var(--white);
    border-radius: 24px;
    padding: 18px 24px 30px;
    box-shadow: 0 12px 40px rgba(20, 36, 122, 0.08);
  }

  /* ==================== هدر ==================== */
  .header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding-bottom: 16px;
    margin-bottom: 16px;
    border-bottom: 2px solid var(--gray-border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-logo {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(20, 36, 122, 0.2);
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .brand-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .brand-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .brand-name {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: 2px;
    line-height: 1.1;
  }
  .brand-sub {
    font-size: 0.72rem;
    color: var(--text-muted);
  }

  .header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  /* آیکون تماس */
  .contact-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--primary);
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    text-decoration: none;
    transition: all 0.25s;
    box-shadow: 0 6px 16px rgba(20, 36, 122, 0.25);
  }
  .contact-icon:hover {
    background: var(--primary-light);
    transform: scale(1.08);
  }

  /* اینستاگرام */
  .insta-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    text-decoration: none;
    transition: all 0.25s;
    box-shadow: 0 6px 16px rgba(220, 39, 67, 0.3);
  }
  .insta-btn:hover { transform: scale(1.08); }

  /* سبد خرید */
  .cart-btn {
    background: var(--primary);
    color: var(--white);
    border: none;
    padding: 12px 18px;
    border-radius: 30px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
    transition: all 0.25s;
    box-shadow: 0 6px 16px rgba(20, 36, 122, 0.25);
  }
  .cart-btn:hover {
    background: var(--primary-light);
    transform: translateY(-2px);
  }
  .cart-count {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #ff3b5c;
    color: var(--white);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    font-size: 0.7rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    border: 2px solid var(--white);
  }

  /* ==================== جستجو ==================== */
  .search-box {
    position: relative;
    margin-bottom: 18px;
  }
  .search-box input {
    width: 100%;
    padding: 12px 44px 12px 18px;
    border: 2px solid var(--gray-border);
    border-radius: 30px;
    background: var(--gray-bg);
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--text-dark);
    outline: none;
    transition: all 0.25s;
  }
  .search-box input:focus {
    border-color: var(--primary);
    background: var(--white);
    box-shadow: 0 0 0 4px rgba(20, 36, 122, 0.1);
  }
  .search-box i {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--primary);
    font-size: 1rem;
    pointer-events: none;
  }

  /* ==================== تب‌های اصلی ==================== */
  .category-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .category-tab {
    background: var(--white);
    border: 1.5px solid var(--gray-border);
    padding: 10px 18px;
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text-muted);
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .category-tab:hover {
    border-color: var(--primary);
    color: var(--primary);
  }
  .category-tab.active {
    background: var(--primary);
    color: var(--white);
    border-color: var(--primary);
    box-shadow: 0 6px 18px rgba(20, 36, 122, 0.28);
  }

  /* ==================== زیرمنو سرد/گرم ==================== */
  .submenu {
    display: none;
    gap: 10px;
    margin: 0 0 20px 0;
    padding: 12px 16px;
    background: var(--gray-bg);
    border-radius: 16px;
    border: 1.5px dashed var(--gray-border);
    animation: slideDown 0.3s ease;
  }
  .submenu.show { display: flex; }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .submenu-btn {
    flex: 1;
    background: var(--white);
    border: 2px solid var(--gray-border);
    padding: 12px 16px;
    border-radius: 14px;
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text-dark);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.25s;
  }
  .submenu-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    transform: translateY(-2px);
  }
  .submenu-btn.active {
    background: var(--primary);
    color: var(--white);
    border-color: var(--primary);
    box-shadow: 0 6px 16px rgba(20, 36, 122, 0.3);
  }
  .submenu-btn i { font-size: 1.05rem; }

  /* ==================== گرید محصولات ==================== */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 16px;
  }

  .product-card {
    background: var(--white);
    border-radius: 18px;
    border: 1.5px solid var(--gray-border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: all 0.28s;
    position: relative;
  }
  .product-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 14px 32px rgba(20, 36, 122, 0.12);
    border-color: var(--primary);
  }

  .product-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--gray-bg);
    overflow: hidden;
    position: relative;
  }
  .product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.5s;
  }
  .product-card:hover .product-image img {
    transform: scale(1.06);
  }

  .product-info {
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .product-name {
    font-size: 0.98rem;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 10px;
    line-height: 1.4;
    min-height: 2.8em;
  }

  .product-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px dashed var(--gray-border);
  }

  .product-price {
    font-size: 0.95rem;
    font-weight: 800;
    color: var(--primary);
    display: flex;
    align-items: baseline;
    gap: 3px;
    white-space: nowrap;
  }
  .product-price small {
    font-size: 0.65rem;
    font-weight: 400;
    color: var(--text-muted);
  }
  .product-price.none {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  .btn-add {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--primary);
    color: var(--white);
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.22s;
    flex-shrink: 0;
  }
  .btn-add:hover {
    background: var(--primary-light);
    transform: scale(1.12);
    box-shadow: 0 6px 16px rgba(20, 36, 122, 0.3);
  }

  .no-result {
    grid-column: 1 / -1;
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    background: var(--gray-bg);
    border-radius: 20px;
  }
  .no-result i {
    font-size: 2.4rem;
    display: block;
    margin-bottom: 12px;
    color: var(--primary);
    opacity: 0.5;
  }

  /* ==================== سبد خرید ==================== */
  .cart-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 20, 50, 0.5);
    backdrop-filter: blur(3px);
    z-index: 900;
    opacity: 0;
    visibility: hidden;
    transition: all 0.35s;
  }
  .cart-overlay.open { opacity: 1; visibility: visible; }

  .cart-drawer {
    position: fixed;
    top: 0; left: 0;
    width: 420px;
    max-width: 92vw;
    height: 100vh;
    background: var(--white);
    z-index: 950;
    transform: translateX(-100%);
    transition: transform 0.4s cubic-bezier(0.3, 0.9, 0.3, 1);
    display: flex;
    flex-direction: column;
    box-shadow: 8px 0 40px rgba(0,0,0,0.15);
  }
  .cart-drawer.open { transform: translateX(0); }

  .cart-header {
    padding: 20px 22px;
    background: var(--primary);
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cart-header h3 {
    font-size: 1.15rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cart-header button {
    background: rgba(255,255,255,0.2);
    border: none;
    color: var(--white);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    transition: background 0.2s;
  }
  .cart-header button:hover { background: rgba(255,255,255,0.35); }

  .cart-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
  }

  .cart-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
  }
  .cart-empty i {
    font-size: 3rem;
    color: var(--gray-border);
    margin-bottom: 16px;
    display: block;
  }

  .cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--gray-border);
  }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-name {
    font-weight: 700;
    font-size: 0.92rem;
    color: var(--text-dark);
    margin-bottom: 3px;
  }
  .cart-item-price {
    font-size: 0.78rem;
    color: var(--primary);
    font-weight: 600;
  }
  .cart-item-price.none {
    color: var(--text-muted);
    font-weight: 500;
    font-size: 0.72rem;
  }

  .qty-control {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--gray-bg);
    border-radius: 30px;
    padding: 3px;
    flex-shrink: 0;
  }
  .qty-control button {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: var(--white);
    color: var(--primary);
    font-weight: 700;
    cursor: pointer;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .qty-control button:hover {
    background: var(--primary);
    color: var(--white);
  }
  .qty-control span {
    min-width: 22px;
    text-align: center;
    font-weight: 700;
    font-size: 0.9rem;
  }

  /* ==================== انتخاب میز ==================== */
  .table-section {
    padding: 14px 20px;
    background: var(--gray-bg);
    border-top: 1px solid var(--gray-border);
  }
  .table-section label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-dark);
    margin-bottom: 10px;
  }
  .table-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .table-btn {
    padding: 12px 6px;
    border: 1.5px solid var(--gray-border);
    background: var(--white);
    border-radius: 12px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--text-dark);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .table-btn:hover { border-color: var(--primary); }
  .table-btn.active {
    background: var(--primary);
    color: var(--white);
    border-color: var(--primary);
    box-shadow: 0 4px 12px rgba(20,36,122,0.3);
  }
  .table-btn.takeaway {
    grid-column: span 1;
    font-size: 0.78rem;
  }
  .table-btn i { font-size: 0.85rem; }

  /* ==================== فوتر سبد ==================== */
  .cart-footer {
    padding: 16px 20px 20px;
    border-top: 2px solid var(--gray-border);
    background: var(--white);
  }
  .cart-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-weight: 700;
  }
  .cart-total span:first-child { color: var(--text-muted); font-size: 0.88rem; }
  .cart-total span:last-child {
    color: var(--primary);
    font-size: 1.2rem;
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .cart-total small { font-size: 0.68rem; font-weight: 400; color: var(--text-muted); }

  .btn-checkout {
    width: 100%;
    background: var(--primary);
    color: var(--white);
    border: none;
    padding: 15px;
    border-radius: 14px;
    font-family: inherit;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.25s;
    box-shadow: 0 6px 18px rgba(20,36,122,0.25);
  }
  .btn-checkout:hover {
    background: var(--primary-light);
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(20,36,122,0.35);
  }
  .btn-checkout:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* ==================== مودال رسید ==================== */
  .receipt-modal {
    position: fixed;
    inset: 0;
    background: rgba(15, 20, 50, 0.6);
    backdrop-filter: blur(4px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .receipt-modal.open { display: flex; }

  .receipt {
    background: var(--white);
    border-radius: 24px;
    padding: 32px 28px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    animation: receiptIn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    max-height: 90vh;
    overflow-y: auto;
  }
  @keyframes receiptIn {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .receipt-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #10b981, #059669);
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    margin: 0 auto 16px;
    box-shadow: 0 10px 30px rgba(16, 185, 129, 0.35);
  }
  .receipt h2 {
    font-size: 1.35rem;
    color: var(--text-dark);
    margin-bottom: 6px;
  }
  .receipt > p {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 20px;
  }

  .order-code {
    background: var(--gray-bg);
    border: 2px dashed var(--primary);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .order-code small {
    display: block;
    color: var(--text-muted);
    font-size: 0.75rem;
    margin-bottom: 6px;
  }
  .order-code strong {
    font-size: 1.8rem;
    color: var(--primary);
    letter-spacing: 3px;
    font-weight: 900;
  }

  .receipt-summary {
    text-align: right;
    background: var(--gray-bg);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 20px;
    font-size: 0.88rem;
    line-height: 1.9;
  }
  .receipt-summary .row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
  }
  .receipt-summary .row.total {
    border-top: 1px solid var(--gray-border);
    margin-top: 8px;
    padding-top: 10px;
    font-weight: 700;
    color: var(--primary);
    font-size: 1rem;
  }

  .btn-close-receipt {
    width: 100%;
    background: var(--primary);
    color: var(--white);
    border: none;
    padding: 14px;
    border-radius: 14px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.25s;
  }
  .btn-close-receipt:hover { background: var(--primary-light); }

  /* ==================== توست ==================== */
  .toast-message {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--primary);
    color: var(--white);
    padding: 13px 24px;
    border-radius: 30px;
    font-weight: 600;
    font-size: 0.9rem;
    box-shadow: 0 10px 30px rgba(20, 36, 122, 0.35);
    opacity: 0;
    transition: all 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    z-index: 1100;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
  }
  .toast-message.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ==================== رسپانسیو ==================== */
  @media (max-width: 768px) {
    body { padding: 0 10px 20px; }
    .container { padding: 14px 14px 24px; border-radius: 20px; margin-top: 14px; }

    .brand-logo { width: 50px; height: 50px; }
    .brand-name { font-size: 1.25rem; }
    .brand-sub { font-size: 0.65rem; }

    .header-actions { width: 100%; justify-content: space-between; }
    .contact-icon, .insta-btn { width: 42px; height: 42px; font-size: 1.05rem; }
    .cart-btn { flex: 1; justify-content: center; padding: 11px 14px; font-size: 0.82rem; }

    .product-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .product-info { padding: 10px 10px 12px; }
    .product-name { font-size: 0.85rem; min-height: 2.6em; }
    .product-price { font-size: 0.85rem; }
    .btn-add { width: 32px; height: 32px; font-size: 0.9rem; }

    .category-tabs { gap: 6px; }
    .category-tab { padding: 8px 12px; font-size: 0.78rem; }

    .submenu-btn { font-size: 0.85rem; padding: 10px 12px; }

    .table-grid { grid-template-columns: repeat(2, 1fr); }
    .table-btn.takeaway { grid-column: span 2; }
  }

  @media (max-width: 420px) {
    .product-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .product-name { font-size: 0.78rem; }
    .product-price { font-size: 0.78rem; }
    .btn-add { width: 30px; height: 30px; }
    .category-tab { font-size: 0.72rem; padding: 7px 10px; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- ===== هدر ===== -->
  <header class="header">
    <div class="brand">
      <div class="brand-logo">
        <img src="logo.webp" alt="NAVE" />
      </div>
      <div class="brand-info">
        <div class="brand-name">NAVE</div>
        <div class="brand-sub">منوی دیجیتال کافه</div>
      </div>
    </div>

  /* ---------- کیک و دسر (بدون قیمت) ---------- */
  { id: 100, name: "کیک روز",     price: null, cat: "cake", img: "caked.webp" },
  { id: 101, name: "تیرامیسو",    price: null, cat: "cake", img: "tira.webp" },
  { id: 102, name: "چیز کیک",     price: null, cat: "cake", img: "ccake.webp" },
  { id: 103, name: "دوبی چاکلت",  price: null, cat: "cake", img: "dchoclet.webp" },
  { id: 104, name: "کوکی",        price: null, cat: "cake", img: "coki.webp" }
];

/* ====================================================================
   State
   ==================================================================== */
let cart = [];
let selectedTable = null;
let currentCategory = "all";
let currentTemp = null;
let currentSearch = "";

/* ====================================================================
   DOM
   ==================================================================== */
const grid = document.getElementById("productGrid");
const searchInput = document.getElementById("searchInput");
const tabs = document.querySelectorAll(".category-tab");
const submenu = document.getElementById("submenu");
const submenuBtns = document.querySelectorAll(".submenu-btn");
const cartDrawer = document.getElementById("cartDrawer");
const cartOverlay = document.getElementById("cartOverlay");
const cartBody = document.getElementById("cartBody");
const cartCount = document.getElementById("cartCount");
const cartTotal = document.getElementById("cartTotal");
const checkoutBtn = document.getElementById("checkoutBtn");
const tableGrid = document.getElementById("tableGrid");
const toastMsg = document.getElementById("toastMessage");
const toastText = document.getElementById("toastText");

/* ====================================================================
   فرمت قیمت
   ==================================================================== */
function formatPrice(p) {
  if (p === null || p === undefined) return null;
  return (p * 1000).toLocaleString("fa-IR");
}

/* ====================================================================
   رندر
   ==================================================================== */
function renderProducts() {
  const filtered = PRODUCTS.filter(p => {
    const matchCat = currentCategory === "all" || p.cat === currentCategory;
    const matchTemp = !currentTemp || p.temp === currentTemp;
    const matchSearch = !currentSearch || p.name.includes(currentSearch);
    return matchCat && matchTemp && matchSearch;
  });

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="no-result">
        <i class="fas fa-mug-hot"></i>
        موردی پیدا نشد 😕
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const priceHTML = p.price === null
      ? `<span class="product-price none">بدون قیمت</span>`
      : `<span class="product-price">${formatPrice(p.price)} <small>تومان</small></span>`;

    return `
      <div class="product-card">
        <div class="product-image">
          <img src="${p.img}" alt="${p.name}" loading="lazy"
               onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22><rect width=%22300%22 height=%22300%22 fill=%22%23f4f6fb%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%236b7391%22 font-size=%2218%22 font-family=%22sans-serif%22>بدون تصویر</text></svg>'" />
        </div>
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-bottom">
            ${priceHTML}
            <button class="btn-add" data-id="${p.id}" aria-label="افزودن">
              <i class="fas fa-plus"></i>
            </button>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

/* ====================================================================
   توست
   ==================================================================== */
let toastTimeout;
function showToast(text) {
  toastText.textContent = text;
  toastMsg.classList.add("show");
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toastMsg.classList.remove("show"), 2000);
}

/* ====================================================================
   سبد
   ==================================================================== */
function addToCart(id) {
  const product = PRODUCTS.find(p => p.id === id);
  if (!product) return;

  const existing = cart.find(c => c.id === id);
  if (existing) existing.qty++;
  else cart.push({ id: product.id, name: product.name, price: product.price, qty: 1 });

  updateCartUI();
  showToast(`${product.name} اضافه شد`);
}

function changeQty(id, delta) {
  const item = cart.find(c => c.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
  updateCartUI();
}

function updateCartUI() {
  const totalQty = cart.reduce((s, i) => s + i.qty, 0);
  cartCount.textContent = totalQty.toLocaleString("fa-IR");

  if (cart.length === 0) {
    cartBody.innerHTML = `
      <div class="cart-empty">
        <i class="fas fa-shopping-bag"></i>
        <p>سبد خرید شما خالی است</p>
      </div>`;
  } else {
    cartBody.innerHTML = cart.map(item => {
      const itemPrice = item.price === null
        ? `<div class="cart-item-price none">بدون قیمت</div>`
        : `<div class="cart-item-price">${formatPrice(item.price * item.qty)} تومان</div>`;
      return `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            ${itemPrice}
          </div>
          <div class="qty-control">
            <button onclick="changeQty(${item.id}, 1)">+</button>
            <span>${item.qty.toLocaleString("fa-IR")}</span>
            <button onclick="changeQty(${item.id}, -1)">−</button>
          </div>
        </div>
      `;
    }).join("");
  }

  const total = cart.reduce((s, i) => {
    if (i.price === null) return s;
    return s + i.price * i.qty;
  }, 0);
  cartTotal.innerHTML = `${(total * 1000).toLocaleString("fa-IR")} <small>تومان</small>`;

  checkoutBtn.disabled = !(cart.length > 0 && selectedTable !== null);
}

/* ====================================================================
   میزها (3 میز + بیرون‌بر)
   ==================================================================== */
function buildTables() {
  let html = "";
  for (let i = 1; i <= 3; i++) {
    html += `<button class="table-btn" data-table="${i}">میز ${i.toLocaleString("fa-IR")}</button>`;
  }
  html += `<button class="table-btn takeaway" data-table="takeaway">
    <i class="fas fa-bag-shopping"></i> بیرون‌بر
  </button>`;
  tableGrid.innerHTML = html;
}

tableGrid.addEventListener("click", e => {
  const btn = e.target.closest(".table-btn");
  if (!btn) return;
  document.querySelectorAll(".table-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  const val = btn.dataset.table;
  selectedTable = val === "takeaway" ? "takeaway" : parseInt(val);
  updateCartUI();
});

/* ====================================================================
   باز/بسته
   ==================================================================== */
function openCart() {
  cartDrawer.classList.add("open");
  cartOverlay.classList.add("open");
}
function closeCart() {
  cartDrawer.classList.remove("open");
  cartOverlay.classList.remove("open");
}

document.getElementById("cartBtn").addEventListener("click", openCart);
document.getElementById("cartClose").addEventListener("click", closeCart);
cartOverlay.addEventListener("click", closeCart);

/* ====================================================================
   کد سفارش غیرتکرار (timestamp + counter + random)
   ==================================================================== */
function generateOrderCode() {
  // counter در localStorage — هیچ‌وقت تکرار نمی‌شه
  let counter = parseInt(localStorage.getItem("nave_order_counter") || "0");
  counter = (counter + 1) % 100;
  localStorage.setItem("nave_order_counter", counter.toString());

  // ۲ رقم آخر ثانیه
  const sec = String(new Date().getSeconds()).padStart(2, "0");
  // counter با صفر پر
  const cnt = String(counter).padStart(2, "0");

  // ترکیب: sec + counter → همیشه یکتا
  return sec + cnt;
}

/* ====================================================================
   پیامک
   ==================================================================== */
function buildOrderMessage(code) {
  const lines = [];
  lines.push(`کد سفارش: ${code}`);
  lines.push("سفارشات:");
  cart.forEach(item => {
    const num = item.qty.toLocaleString("fa-IR");
    lines.push(`${num} ${item.name}`);
  });
  lines.push(`میز: ${selectedTable === "takeaway" ? "بیرون‌بر" : selectedTable}`);
  return lines.join("\n");
}

checkoutBtn.addEventListener("click", () => {
  if (selectedTable === null || cart.length === 0) return;

  const code = generateOrderCode();
  const message = buildOrderMessage(code);

  // نمایش رسید
  document.getElementById("orderCode").textContent = code;

  const rows = cart.map(i =>
    `<div class="row"><span>${i.qty.toLocaleString("fa-IR")} × ${i.name}</span></div>`
  ).join("");

  const total = cart.reduce((s, i) => {
    if (i.price === null) return s;
    return s + i.price * i.qty;
  }, 0);

  document.getElementById("receiptSummary").innerHTML = `
    <div class="row"><span>محل سرو</span><span>${selectedTable === "takeaway" ? "بیرون‌بر" : "میز " + selectedTable}</span></div>
    ${rows}
    <div class="row total"><span>جمع کل</span><span>${(total * 1000).toLocaleString("fa-IR")} تومان</span></div>
  `;

  document.getElementById("receiptModal").classList.add("open");

  // ارسال پیامک
  const encoded = encodeURIComponent(message);
  window.location.href = `sms:${CONFIG.OWNER_PHONE}?body=${encoded}`;

  // پاک‌سازی
  cart = [];
  selectedTable = null;
  document.querySelectorAll(".table-btn").forEach(b => b.classList.remove("active"));
  updateCartUI();
  closeCart();
});

document.getElementById("closeReceipt").addEventListener("click", () => {
  document.getElementById("receiptModal").classList.remove("open");
});

/* ====================================================================
   رویدادها
   ==================================================================== */
grid.addEventListener("click", e => {
  const btn = e.target.closest(".btn-add");
  if (!btn) return;
  addToCart(parseInt(btn.dataset.id));
});

searchInput.addEventListener("input", e => {
  currentSearch = e.target.value.trim();
  renderProducts();
});

/* ====================================================================
   تب‌های اصلی + زیرمنو سرد/گرم
   ==================================================================== */
tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(t => t.classList.remove("active"));
    tab.classList.add("active");

    currentCategory = tab.dataset.category;
    currentTemp = null;

    // نمایش زیرمنو برای اسپرسو و نوشیدنی
    if (currentCategory === "espresso" || currentCategory === "drink") {
      submenu.classList.add("show");
      // پیش‌فرض: گرم
      submenuBtns.forEach(b => b.classList.remove("active"));
      document.querySelector('.submenu-btn[data-temp="hot"]').classList.add("active");
      currentTemp = "hot";
    } else {
      submenu.classList.remove("show");
    }

    renderProducts();
  });
});

submenuBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    submenuBtns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentTemp = btn.dataset.temp;
    renderProducts();
  });
});

/* ====================================================================
   شروع
   ==================================================================== */
buildTables();
updateCartUI();
renderProducts();
</script>
